<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 128 980 144" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="datos-title datos-desc" id="datos-root">
        <title id="datos-title">De dónde salen los datos de abitech.dev</title>
        <desc id="datos-desc">Los datos nacen en abitech-trayectoria-cli, llegan por un PR automático a src/data, el sitio los publica en /resume.json y el perfil de GitHub los lee cada día.</desc>
