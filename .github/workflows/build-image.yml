name: Construir la imagen

on:
  workflow_call:
    inputs:
      etiqueta:
        type: string
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGEN: ghcr.io/${{ github.repository }}
  TRIVY: 0.76.1

jobs:
  imagen:
    name: Construir, probar y publicar
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Con la huella del árbol, main reutiliza la imagen de develop.
      - id: huella
        run: echo "arbol=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          load: true
          tags: ${{ env.IMAGEN }}:prueba
          build-args: &argumentos |
            VERSION=${{ steps.huella.outputs.arbol }}
            PUBLIC_UMAMI_SRC=${{ vars.PUBLIC_UMAMI_SRC }}
            PUBLIC_UMAMI_ID=${{ vars.PUBLIC_UMAMI_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Probar
        run: |
          docker run -d -p 8080:80 "$IMAGEN:prueba"
          curl -fsS --retry 20 --retry-delay 1 --retry-all-errors -o /dev/null localhost:8080/
          curl -fsS -o /dev/null localhost:8080/cv
          curl -fsSI localhost:8080/ | grep -qi "^content-security-policy:"
          curl -fsSI localhost:8080/ | grep -qi "^strict-transport-security:"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/no-existe)" = 404

      # Bloquea si hay una vulnerabilidad alta o crítica con corrección.
      - name: Revisar vulnerabilidades (Trivy)
        run: |
          base=https://github.com/aquasecurity/trivy/releases/download/v$TRIVY
          curl -fsSLO "$base/trivy_${TRIVY}_Linux-64bit.tar.gz"
          curl -fsSL "$base/trivy_${TRIVY}_checksums.txt" | sha256sum -c --ignore-missing
          tar -xzf "trivy_${TRIVY}_Linux-64bit.tar.gz" trivy
          ./trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile .trivyignore.yaml --exit-code 1 "$IMAGEN:prueba"

      - name: Publicar
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: |
            ${{ env.IMAGEN }}:arbol-${{ steps.huella.outputs.arbol }}
            ${{ env.IMAGEN }}:${{ inputs.etiqueta }}
          build-args: *argumentos
          cache-from: type=gha
