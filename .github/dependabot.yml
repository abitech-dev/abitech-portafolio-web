version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      acciones:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      menores:
        update-types: [minor, patch]
    commit-message:
      prefix: build

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
